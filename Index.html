<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Service Management System</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        margin:0;
        padding:0;
    }

    header{
        background:#007bff;
        color:white;
        text-align:center;
        padding:20px;
    }

    .container{
        width:80%;
        margin:20px auto;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    input, select{
        width:100%;
        padding:10px;
        margin:8px 0;
    }

    button{
        background:#007bff;
        color:white;
        border:none;
        padding:10px 20px;
        cursor:pointer;
        border-radius:5px;
    }

    button:hover{
        background:#0056b3;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    table, th, td{
        border:1px solid #ddd;
    }

    th{
        background:#007bff;
        color:white;
    }

    th, td{
        padding:10px;
        text-align:center;
    }
</style>
</head>
<body>

<header>
    <h1>Vehicle Service Management System</h1>
</header>

<div class="container">

    <h2>Add Service Record</h2>

    <input type="text" id="owner" placeholder="Owner Name">

    <input type="text" id="vehicle" placeholder="Vehicle Number">

    <select id="service">
        <option>Oil Change</option>
        <option>Engine Service</option>
        <option>Washing</option>
        <option>Tyre Replacement</option>
    </select>

    <button onclick="addRecord()">Add Record</button>

    <table>
        <thead>
            <tr>
                <th>Owner Name</th>
                <th>Vehicle Number</th>
                <th>Service Type</th>
            </tr>
        </thead>
        <tbody id="records"></tbody>
    </table>

</div>

<script>
function addRecord() {

    let owner = document.getElementById("owner").value;
    let vehicle = document.getElementById("vehicle").value;
    let service = document.getElementById("service").value;

    if(owner === "" || vehicle === ""){
        alert("Please fill all fields");
        return;
    }

    let table = document.getElementById("records");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = owner;
    row.insertCell(1).innerHTML = vehicle;
    row.insertCell(2).innerHTML = service;

    document.getElementById("owner").value = "";
    document.getElementById("vehicle").value = "";
}
</script>

</body>
  </html>
